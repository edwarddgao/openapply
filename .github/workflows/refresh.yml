name: daily-refresh

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: compute date
        id: d
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: fetch jobs
        run: python oa_adapter.py --workers 16 --out jobs.jsonl

      - name: convert to parquet
        run: python scripts/jsonl_to_parquet.py jobs.jsonl data --date ${{ steps.d.outputs.date }}

      - name: publish to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID || 'edwarddgao/open-apply-jobs' }}
        run: python scripts/publish_hf.py data --date ${{ steps.d.outputs.date }}

      - name: embed + publish embeddings
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_EMB_REPO_ID: ${{ vars.HF_EMB_REPO_ID || 'edwarddgao/open-apply-jobs-embeddings' }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY not set — skipping embeddings"
            exit 0
          fi
          python scripts/embed.py data embeddings \
            --date ${{ steps.d.outputs.date }} \
            --bootstrap-from-hf
          python scripts/publish_hf.py embeddings \
            --repo-id "$HF_EMB_REPO_ID" \
            --date ${{ steps.d.outputs.date }}

      - name: enrich + publish enrichments
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ENR_REPO_ID: ${{ vars.HF_ENR_REPO_ID || 'edwarddgao/open-apply-jobs-enrichments' }}
        run: |
          if [ ! -d "embeddings/date=${{ steps.d.outputs.date }}" ]; then
            echo "no embeddings partition for today — skipping enrichments"
            exit 0
          fi
          python scripts/enrich.py data embeddings enrichments \
            --date ${{ steps.d.outputs.date }} \
            --bootstrap-from-hf
          python scripts/publish_hf.py enrichments \
            --repo-id "$HF_ENR_REPO_ID" \
            --date ${{ steps.d.outputs.date }}

      - name: summary
        if: always()
        run: |
          echo "date: ${{ steps.d.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "jsonl lines: $(wc -l < jobs.jsonl 2>/dev/null || echo N/A)" >> $GITHUB_STEP_SUMMARY
          du -sh data/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
