name: daily-refresh

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to Hugging Face (false = dry run to time the fetch)'
        type: boolean
        default: true

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Full Workday/SmartRecruiters boards took ~3h locally; GitHub allows 6h per job.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: compute date
        id: d
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: fetch jobs
        # --full-boards keeps every Workday/SmartRecruiters posting rather than the
        # local shortlist's recent role-like subset; see the dataset card.
        run: python oa_adapter.py --workers 64 --full-boards --out jobs.jsonl

      - name: convert to parquet
        run: python scripts/jsonl_to_parquet.py jobs.jsonl data --date ${{ steps.d.outputs.date }}

      - name: publish to HF
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID || 'edwarddgao/open-apply-jobs' }}
        run: python scripts/publish_hf.py data --date ${{ steps.d.outputs.date }}

      - name: summary
        if: always()
        run: |
          echo "date: ${{ steps.d.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "jsonl lines: $(wc -l < jobs.jsonl 2>/dev/null || echo N/A)" >> $GITHUB_STEP_SUMMARY
          du -sh data/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
